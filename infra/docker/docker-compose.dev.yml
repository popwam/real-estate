services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: popwam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: popwam
    ports:
      - "5432:5432"
    volumes:
      - popwam_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: popwam-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  popwam_postgres_data:
